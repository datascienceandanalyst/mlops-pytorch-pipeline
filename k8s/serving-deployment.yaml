apiVersion: apps/v1
kind: Deployment
metadata:
  name: cifar10-serving
  namespace: ml-training
  labels:
    app: cifar10-serving

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: cifar10-serving

  template:
    metadata:
      labels:
        app: cifar10-serving

    spec:
      containers:
        - name: serving
          image: cifar10-serving:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          volumeMounts:
            - name: training-checkpoints
              mountPath: /app/checkpoints
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 15

      volumes:
        - name: training-checkpoints
          persistentVolumeClaim:
            claimName: training-checkpoints-pvc